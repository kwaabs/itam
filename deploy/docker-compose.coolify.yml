name: itam

services:
  db:
    image: ${POSTGRES_IMAGE:-supabase/postgres:15.14.1.095}
    container_name: itam-db
    environment:
      # The supabase/postgres image hardcodes `supabase_admin` as its superuser in
      # migrate.sh; do NOT change this or the image's own bootstrap fails on a fresh
      # volume. PGPASSWORD/POSTGRES_HOST let migrate.sh connect over the local socket.
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: /var/run/postgresql
      # Consumed by the initdb role script (see deploy/initdb).
      ITAM_DB_PASSWORD: ${ITAM_DB_PASSWORD:-itam_app_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5600}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Single-file mount so we add to (not shadow) the image's own init scripts.
      - pgsodium_key:/etc/postgresql-custom
      - ./deploy/initdb/zzz-itam-roles.sh:/docker-entrypoint-initdb.d/zzz-itam-roles.sh:ro
    healthcheck:
      # Probe the TCP listener (only up after the full init + migrate.sh finishes)
      # to avoid false positives from the temporary init-phase socket server.
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: itam-valkey
    command: [ "valkey-server", "--save", "60", "1" ]
    ports:
      - "${REDIS_PORT:-5601}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: itam-nats
    command: [ "-js", "-sd", "/data" ]
    ports:
      - "${NATS_PORT:-5602}:4222"
      - "${NATS_MONITOR_PORT:-5603}:8222"
    volumes:
      - nats_data:/data

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: itam-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-5604}:9000"
    volumes:
      - rustfs_data:/data

  # Goose migrations. Runs once, applies all SQL, then exits.
  migrate:
    build:
      context: ./backend
      dockerfile: ../deploy/goose.Dockerfile
    container_name: itam-migrate
    depends_on:
      db:
        condition: service_healthy
    command: >
      -dir /migrations postgres "postgres://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable" up
    restart: no

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itam-api
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://itam_app:${ITAM_DB_PASSWORD:-itam_app_dev_pw}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      REDIS_ADDR: "valkey:6379"
      NATS_URL: "nats://nats:4222"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      S3_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: ${S3_BUCKET:-itam}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@itam.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5608,http://localhost:5609}
      DEBUG: ${DEBUG:-true}
    ports:
      - "${API_PORT:-5607}:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itam-web
    depends_on:
      - api
    environment:
      # Public URL the browser uses.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5607}
    ports:
      - "${WEB_PORT:-5608}:3000"

volumes:
  db_data:
  pgsodium_key:
    external: true
    name: itam-pgsodium-key
  valkey_data:
  nats_data:
  rustfs_data:
