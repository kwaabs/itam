name: itam

services:
  db:
    image: ${POSTGRES_IMAGE:-supabase/postgres:15.14.1.095}
    container_name: itam-db
    environment:
      # The supabase/postgres image hardcodes `supabase_admin` as its superuser in
      # migrate.sh; do NOT change this or the image's own bootstrap fails on a fresh
      # volume. PGPASSWORD/POSTGRES_HOST let migrate.sh connect over the local socket.
      POSTGRES_USER: ${POSTGRES_USER:-supabase_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_HOST: /var/run/postgresql
      # Consumed by the initdb role script (see deploy/initdb).
      ITAM_DB_PASSWORD: ${ITAM_DB_PASSWORD:-itam_app_dev_pw}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_admin_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5600}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Single-file mount so we add to (not shadow) the image's own init scripts.
      - ./initdb/zzz-itam-roles.sh:/docker-entrypoint-initdb.d/zzz-itam-roles.sh:ro
    healthcheck:
      # Probe the TCP listener (only up after the full init + migrate.sh finishes)
      # to avoid false positives from the temporary init-phase socket server.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supabase_admin} -d ${POSTGRES_DB:-postgres} -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s

  valkey:
    image: valkey/valkey:8-alpine
    container_name: itam-valkey
    command: ["valkey-server", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-5601}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: itam-nats
    command: ["-js", "-sd", "/data"]
    ports:
      - "${NATS_PORT:-5602}:4222"
      - "${NATS_MONITOR_PORT:-5603}:8222"
    volumes:
      - nats_data:/data

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: itam-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_PORT:-5604}:9000"
    volumes:
      - rustfs_data:/data

  # Goose migrations. Runs once, applies all SQL, then exits.
  migrate:
    build:
      context: .
      dockerfile: goose.Dockerfile
    container_name: itam-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    command: >
      -dir /migrations postgres
      "postgres://${POSTGRES_USER:-supabase_admin}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      up
    restart: "no"

  # GoTrue: authentication (email/password now, OIDC/Azure-ready).
  # GoTrue auto-migrates its own `auth` schema, so it only needs the database
  # and is part of the build-free infra stack (see `make infra-up`).
  auth:
    image: ${GOTRUE_IMAGE:-supabase/gotrue:v2.158.1}
    container_name: itam-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: "postgres://supabase_auth_admin:${AUTH_DB_PASSWORD:-auth_admin_dev_pw}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=auth"
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5608}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:5608,http://localhost:5609,itam://sso-callback}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: "service_role,supabase_admin"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL:-http://localhost:5606}
      # Azure AD (OIDC) - fill in and flip enabled to true to turn on SSO.
      GOTRUE_EXTERNAL_AZURE_ENABLED: ${AZURE_ENABLED:-false}
      GOTRUE_EXTERNAL_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_AZURE_SECRET: ${AZURE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_AZURE_URL: ${AZURE_URL:-}
      GOTRUE_EXTERNAL_AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-http://localhost:5606/callback}
    ports:
      - "${GOTRUE_PORT:-5606}:9999"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: itam-api
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      nats:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://itam_app:${ITAM_DB_PASSWORD:-itam_app_dev_pw}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      REDIS_ADDR: "valkey:6379"
      NATS_URL: "nats://nats:4222"
      GOTRUE_URL: "http://auth:9999"
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      S3_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: ${S3_BUCKET:-itam}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@itam.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5608,http://localhost:5609}
      DEBUG: ${DEBUG:-true}
      AZURE_ENABLED: ${AZURE_ENABLED:-false}
    ports:
      - "${API_PORT:-5607}:8080"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: itam-web
    depends_on:
      - api
    environment:
      # Public URLs the browser uses.
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5607}
      PUBLIC_GOTRUE_URL: ${PUBLIC_GOTRUE_URL:-http://localhost:5606}
    ports:
      - "${WEB_PORT:-5608}:3000"

volumes:
  db_data:
  valkey_data:
  nats_data:
  rustfs_data:
